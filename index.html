<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">
<title>Aswan Nutribites</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--s1:#131316;--s2:#1b1b20;--ln:#26262d;--p:#7c4dff;--pl:#b39bff;--tx:#f2f2f4;--mu:#8a8a96;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1080px;margin:auto;padding:0 16px}
#splash{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;font-size:34px;font-weight:700;transition:opacity .5s,visibility .5s}
#splash i{color:var(--p);font-style:normal}
#splash.hide{opacity:0;visibility:hidden}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{font-size:24px;font-weight:700;letter-spacing:-.3px}
.brand i{color:var(--p);font-style:normal}
.cartb{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--s1);display:grid;place-items:center}
.badge{position:absolute;top:-3px;left:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--p);font-size:11px;font-weight:700;display:grid;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.badge.on{transform:scale(1)}
.sw{position:relative}
.sw .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--mu)}
#q{width:100%;height:46px;border-radius:14px;border:1px solid var(--ln);background:var(--s1);padding:0 44px 0 14px;font-size:15px;outline:none;transition:border-color .2s}
#q:focus{border-color:var(--p)}
#q::placeholder{color:var(--mu)}
/* categories */
.cats{display:flex;gap:16px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:68px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:var(--mu);transition:color .2s}
.cat i{width:64px;height:64px;border-radius:50%;background:var(--s1);border:1px solid var(--ln);display:grid;place-items:center;transition:background .25s,border-color .25s,transform .2s}
.cat i .ic{width:26px;height:26px}
.cat:active i{transform:scale(.93)}
.cat.on{color:var(--tx);font-weight:600}
.cat.on i{background:var(--p);border-color:var(--p);color:#fff}
/* sections */
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 14px}
.sh h2{margin:0;font-size:19px;font-weight:700}
.sh span{font-size:13px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px;padding-bottom:110px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:20px 16px}}
.card{opacity:0;animation:in .45s calc(var(--i)*40ms) forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.im{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:var(--s1);border:1px solid var(--ln);display:grid;place-items:center;color:#3a3a46}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im>.ic{width:42px;height:42px;stroke-width:1.4}
.ctl{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;background:var(--p);border-radius:20px;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.ctl button{width:36px;height:36px;border:0;background:none;display:grid;place-items:center;border-radius:50%}
.ctl button:active{transform:scale(.88)}
.ctl .ic{width:18px;height:18px;stroke-width:2.2}
.ctl b{min-width:20px;text-align:center;font-size:14px}
.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.12)}}
.nm{margin:9px 2px 0;font-size:14.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ct{margin:2px 2px 0;font-size:12px;color:var(--mu)}
.pr{margin:3px 2px 0;font-size:14px;font-weight:700;color:var(--pl)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:70px 20px;font-size:15px}
.empty .ic{width:46px;height:46px;stroke-width:1.2;margin-bottom:10px;color:#3a3a46}
/* cart bar */
.bar{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:520px;margin:auto;z-index:25;height:54px;border-radius:16px;border:0;background:var(--p);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 8px 28px rgba(0,0,0,.55);transform:translateY(110px);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.bar.on{transform:none}
.bar span:last-child{background:rgba(255,255,255,.2);border-radius:10px;padding:2px 12px}
/* sheets */
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.modal.show{opacity:1;visibility:visible}
.box{background:var(--s1);width:100%;max-width:500px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(60px);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.modal.show .box{transform:none}
@media(min-width:640px){.modal{align-items:center}.box{border-radius:24px;padding-bottom:20px}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--ln);margin:6px auto 14px}
.box h3{margin:0 0 6px;font-size:18px;font-weight:700}
label{display:block;font-size:12.5px;color:var(--mu);margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);font-size:15px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;margin-top:16px;border:0;border-radius:14px;background:var(--p);color:#fff;font-size:15px;font-weight:600;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.g{background:var(--s2);border:1px solid var(--ln);color:var(--tx)}
.btn.sm{height:36px;width:auto;margin:0;padding:0 14px;font-size:13px;border-radius:10px}
.btn.d{background:#3a1520;color:#ff9aa9}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.th{width:52px;height:52px;border-radius:12px;overflow:hidden;background:var(--s2);display:grid;place-items:center;flex:none;color:#4a4a58}
.th img{width:100%;height:100%;object-fit:cover}
.line .t{flex:1;min-width:0;font-size:14.5px;font-weight:500}
.line .t small{display:block;color:var(--mu);font-size:12px;font-weight:400}
.mini{display:flex;align-items:center;background:var(--s2);border-radius:20px;border:1px solid var(--ln)}
.mini button{width:34px;height:34px;border:0;background:none;display:grid;place-items:center}
.mini .ic{width:16px;height:16px;stroke-width:2.2}
.mini b{min-width:20px;text-align:center;font-size:14px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:13px 14px;border-radius:12px;background:var(--s2);font-size:14px;color:var(--mu)}
.ph b{color:var(--tx);direction:ltr;font-weight:600}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-70px);background:var(--s2);border:1px solid var(--ln);padding:11px 20px;border-radius:14px;font-size:14px;font-weight:500;z-index:99;transition:transform .35s cubic-bezier(.2,.9,.3,1);pointer-events:none}
#toast.show{transform:translate(-50%,0)}
.sk{aspect-ratio:1/1;border-radius:18px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
#splash{direction:ltr;font-size:30px;letter-spacing:-.4px}
.brand{direction:ltr}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>

<symbol id="i-basic" viewBox="0 0 24 24"><path d="M12 22V8"/><path d="M12 8c-3 0-4-2-4-4 3 0 4 2 4 4zM12 8c3 0 4-2 4-4-3 0-4 2-4 4zM12 14c-3 0-4-2-4-4 3 0 4 2 4 4zM12 14c3 0 4-2 4-4-3 0-4 2-4 4z"/></symbol>
<symbol id="i-canned" viewBox="0 0 24 24"><path d="M5 6c0-1.5 3-3 7-3s7 1.5 7 3-3 3-7 3-7-1.5-7-3z"/><path d="M5 6v12c0 1.5 3 3 7 3s7-1.5 7-3V6"/><path d="M5 12c0 1.5 3 3 7 3s7-1.5 7-3"/></symbol>

</defs></svg>

<div id="splash"><div>Aswan Nutribites<i>.</i></div></div>

<header><div class="wrap">
  <div class="hd"><div class="brand">Aswan Nutribites<i>.</i></div>
    <button class="cartb" id="cartB" aria-label="السلة"><svg class="ic"><use href="#i-bag"/></svg><span class="badge" id="badge">0</span></button></div>
  <div class="sw"><svg class="ic"><use href="#i-search"/></svg><input id="q" placeholder="ابحث عن منتج" autocomplete="off" enterkeyhint="search"></div>
</div></header>

<main class="wrap">
  <div class="cats" id="cats"></div>
  <div class="sh"><h2 id="ttl">كل المنتجات</h2><span id="cnt"></span></div>
  <div class="grid" id="grid"></div>
</main>

<button class="bar" id="bar"><span>عرض السلة</span><span id="barN">0</span></button>

<div class="modal" id="cartM"><div class="box"><div class="grab"></div>
  <h3>سلة الطلب</h3>
  <div id="cLines"></div>
  <label>الاسم</label><input id="oUser" placeholder="اكتب اسمك">
  <label>ملاحظات</label><textarea id="oNote" rows="2" placeholder="اختياري"></textarea>
  <div class="ph"><span>رقم الطلب</span><b id="oPhone"></b></div>
  <button class="btn" id="oSend">إرسال الطلب عبر واتساب</button>
  <button class="btn g" data-close style="margin-top:10px">متابعة التسوق</button>
</div></div>

<div class="modal" id="admM"><div class="box"><div class="grab"></div>
  <h3>لوحة الإدارة</h3>
  <label>اسم المنتج</label><input id="aName" placeholder="مثال: أرز بسمتي">
  <label>التصنيف</label><select id="aCat"></select>
  <label>السعر (اختياري)</label><input id="aPrice" placeholder="مثال: 2500 ر.ي">
  <label>صورة المنتج</label><input id="aImg" type="file" accept="image/*">
  <button class="btn" id="aAdd">إضافة المنتج</button>
  <h3 style="margin-top:28px">رقم الطلب</h3>
  <input id="aPhone" placeholder="967700000000" dir="ltr" inputmode="numeric">
  <button class="btn" id="aSavePh">حفظ الرقم</button>
  <h3 style="margin-top:28px">المنتجات</h3>
  <div id="aList"></div>
  <button class="btn g" id="aOut" style="display:none">تسجيل الخروج</button>
  <button class="btn g" data-close>إغلاق</button>
</div></div>
<div id="toast"></div>

<script>
/* ===== Firebase: الصق إعدادات مشروعك هنا (انظر README.md) ===== */
var CFG={apiKey:"AIzaSyCoTesh3i-Jw-TPSEZLE3cWDFKFYEm1EZE",authDomain:"aswan-50d49.firebaseapp.com",databaseURL:"https://aswan-50d49-default-rtdb.firebaseio.com",projectId:"aswan-50d49",storageBucket:"aswan-50d49.firebasestorage.app",messagingSenderId:"226568178880",appId:"1:226568178880:web:9d5f56fc41eff1dc61f125"};
var ADMIN_EMAIL="admin@khayrat.app"; /* نفس الإيميل الذي تنشئه في Authentication */
/* =============================================================== */
var USE_FB=!!CFG.apiKey, FB=null, loaded=!USE_FB;
var CATS=[['all','الكل'],['basic','أساسيات'],['canned','معلبات'],['frozen','مجمدات'],['oil','زيوت وتوابل'],['snack','سناكس'],['sweet','حلويات'],['drink','مشروبات']];
var products=USE_FB?[]:load('kh_products',[]), phone=USE_FB?'000000000000':load('kh_phone','000000000000'), cat='all', cart={};
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('المساحة ممتلئة')}}
function $(i){return document.getElementById(i)}
function ic(n){return '<svg class="ic"><use href="#i-'+n+'"/></svg>'}
function cname(c){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===c)return CATS[i][1];return ''}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function byId(id){return products.filter(function(p){return p.id==id})[0]}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function denied(e){toast(/permission/i.test(String(e&&(e.code||'')+(e&&e.message||'')))?'غير مصرح — سجّل الدخول':'حدث خطأ، حاول مرة أخرى')}
setTimeout(function(){$('splash').classList.add('hide')},1100);

/* ---------- البيانات ---------- */
function initFB(){
  var base='https://www.gstatic.com/firebasejs/10.14.1/';
  Promise.all([import(base+'firebase-app.js'),import(base+'firebase-database.js'),import(base+'firebase-auth.js')]).then(function(m){
    var app=m[0].initializeApp(CFG);
    FB={D:m[1],Au:m[2],db:m[1].getDatabase(app),auth:m[2].getAuth(app)};
    FB.D.onValue(FB.D.ref(FB.db,'products'),function(s){
      var v=s.val()||{};
      products=Object.keys(v).map(function(k){var o=v[k];o.id=k;return o}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
      loaded=true;afterData();
    },function(){loaded=true;afterData();toast('تعذر تحميل المنتجات')});
    FB.D.onValue(FB.D.ref(FB.db,'settings/phone'),function(s){var v=s.val();if(v){phone=v;$('oPhone').textContent=phone;if(document.activeElement!==$('aPhone'))$('aPhone').value=phone}});
  }).catch(function(){loaded=true;drawGrid();toast('تعذر الاتصال بـ Firebase')});
}
function afterData(){
  for(var k in cart)if(!byId(k))delete cart[k];
  drawGrid();drawAdmin();updateBar();
  if($('cartM').classList.contains('show'))drawCart();
}
function addProduct(o){
  if(FB){var r=FB.D.push(FB.D.ref(FB.db,'products'));return FB.D.set(r,Object.assign({},o,{createdAt:Date.now()}))}
  o.id=Date.now();products.unshift(o);save('kh_products',products);drawAdmin();drawGrid();return Promise.resolve();
}
function delProduct(id){
  if(FB)return FB.D.remove(FB.D.ref(FB.db,'products/'+id));
  products=products.filter(function(p){return p.id!=id});save('kh_products',products);drawAdmin();drawGrid();return Promise.resolve();
}
function setPhone(v){
  if(FB)return FB.D.set(FB.D.ref(FB.db,'settings/phone'),v);
  phone=v;save('kh_phone',phone);return Promise.resolve();
}

/* ---------- الواجهة ---------- */
function ctl(p){var n=cart[p.id]||0;
  return n?'<button data-m="'+p.id+'">'+ic('minus')+'</button><b>'+n+'</b><button data-p="'+p.id+'">'+ic('plus')+'</button>':'<button data-p="'+p.id+'" aria-label="إضافة">'+ic('plus')+'</button>'}
function thumb(p){return p.img?'<img src="'+p.img+'" alt="">':ic('bag')}
function count(){var n=0;for(var k in cart)n+=cart[k];return n}
function drawCats(){
  $('cats').innerHTML=CATS.map(function(c){return '<button class="cat'+(c[0]===cat?' on':'')+'" data-c="'+c[0]+'"><i>'+ic(c[0])+'</i>'+c[1]+'</button>'}).join('');
  $('aCat').innerHTML=CATS.slice(1).map(function(c){return '<option value="'+c[0]+'">'+c[1]+'</option>'}).join('');
}
function drawGrid(){
  $('ttl').textContent=cat==='all'?'كل المنتجات':cname(cat);
  if(!loaded){$('cnt').textContent='';$('grid').innerHTML='<div><div class="sk"></div></div><div><div class="sk"></div></div><div><div class="sk"></div></div><div><div class="sk"></div></div>';return}
  var t=$('q').value.trim().toLowerCase();
  var list=products.filter(function(p){return (cat==='all'||p.cat===cat)&&(!t||p.name.toLowerCase().indexOf(t)>-1)});
  $('cnt').textContent=list.length?list.length+' منتج':'';
  $('grid').innerHTML=list.length?list.map(function(p,i){
    return '<div class="card" style="--i:'+Math.min(i,12)+'"><div class="im">'+(p.img?'<img loading="lazy" src="'+p.img+'" alt="">':ic('bag'))+'<div class="ctl" id="c'+p.id+'">'+ctl(p)+'</div></div><div class="nm">'+esc(p.name)+'</div><div class="ct">'+cname(p.cat)+'</div>'+(p.price?'<div class="pr">'+esc(p.price)+'</div>':'')+'</div>';
  }).join(''):'<div class="empty">'+ic('bag')+'<div>لا توجد منتجات</div></div>';
}
function updateBar(){var n=count();$('badge').textContent=n;$('badge').classList.toggle('on',n>0);$('barN').textContent=n;$('bar').classList.toggle('on',n>0)}
function sync(id){
  var p=byId(id),el=$('c'+id);if(p&&el){el.innerHTML=ctl(p);el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
  updateBar();if($('cartM').classList.contains('show'))drawCart();
}
function drawCart(){
  var ids=Object.keys(cart);
  if(!ids.length){$('cartM').classList.remove('show');return}
  $('cLines').innerHTML=ids.map(function(id){var p=byId(id);if(!p)return '';
    return '<div class="line"><div class="th">'+thumb(p)+'</div><div class="t">'+esc(p.name)+(p.price?'<small>'+esc(p.price)+'</small>':'')+'</div><div class="mini"><button data-m="'+id+'">'+ic('minus')+'</button><b>'+cart[id]+'</b><button data-p="'+id+'">'+ic('plus')+'</button></div></div>'}).join('');
}
function drawAdmin(){
  if(document.activeElement!==$('aPhone'))$('aPhone').value=phone;
  $('aList').innerHTML=products.map(function(p){
    return '<div class="line"><div class="th">'+thumb(p)+'</div><div class="t">'+esc(p.name)+'<small>'+cname(p.cat)+'</small></div><button class="btn sm d" data-d="'+p.id+'">حذف</button></div>';
  }).join('')||'<div style="color:var(--mu);padding:10px 0;font-size:14px">لم تضف منتجات بعد</div>';
}
function openAdmin(){drawAdmin();$('aOut').style.display=FB?'flex':'none';$('admM').classList.add('show')}
function openCart(){if(!count()){toast('السلة فارغة');return}$('oPhone').textContent=phone;drawCart();$('cartM').classList.add('show')}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-c],[data-p],[data-m],[data-d],[data-close]');if(!t)return;
  var d=t.dataset;
  if(d.c){cat=d.c;drawCats();drawGrid()}
  else if(d.p){cart[d.p]=(cart[d.p]||0)+1;sync(d.p)}
  else if(d.m){cart[d.m]=(cart[d.m]||1)-1;if(cart[d.m]<1)delete cart[d.m];sync(d.m)}
  else if(d.d){delete cart[d.d];updateBar();delProduct(d.d).then(function(){toast('تم الحذف')}).catch(denied)}
  else document.querySelectorAll('.modal').forEach(function(m){m.classList.remove('show')});
});
document.querySelectorAll('.modal').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('show')})});
$('bar').onclick=openCart;$('cartB').onclick=openCart;

/* البحث + فتح لوحة الإدارة */
$('q').addEventListener('input',function(){
  if(!USE_FB&&$('q').value.trim()===LOCAL_PASS){$('q').value='';openAdmin()}
  drawGrid();
});
$('q').addEventListener('keydown',function(e){
  if(e.key!=='Enter'||!USE_FB)return;
  var v=$('q').value.trim();if(v.length<6)return;
  if(!FB){toast('جارٍ الاتصال...');return}
  FB.Au.signInWithEmailAndPassword(FB.auth,ADMIN_EMAIL,v).then(function(){$('q').value='';drawGrid();openAdmin()}).catch(function(){});
});
$('aOut').onclick=function(){FB.Au.signOut(FB.auth).then(function(){document.querySelectorAll('.modal').forEach(function(m){m.classList.remove('show')});toast('تم تسجيل الخروج')})};

$('oSend').onclick=function(){
  var lines=Object.keys(cart).map(function(id){var p=byId(id);return p?'• '+p.name+' × '+cart[id]+(p.price?' ('+p.price+')':''):''}).join('\n');
  var m=encodeURIComponent('طلب جديد — Aswan Nutribites\n\n'+lines+'\n\nالاسم: '+$('oUser').value+'\nملاحظات: '+$('oNote').value);
  window.open('https://wa.me/'+phone.replace(/\D/g,'')+'?text='+m,'_blank');
};
$('aSavePh').onclick=function(){
  var v=$('aPhone').value.replace(/\D/g,'');if(v.length<6){toast('اكتب رقمًا صحيحًا');return}
  setPhone(v).then(function(){toast('تم حفظ الرقم')}).catch(denied);
};
function shrink(file,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg',0.72))};im.src=r.result};
  r.readAsDataURL(file);
}
$('aAdd').onclick=function(){
  var n=$('aName').value.trim();if(!n){toast('اكتب اسم المنتج');return}
  var btn=this;btn.disabled=true;btn.style.opacity=.6;
  function add(img){
    addProduct({name:n,cat:$('aCat').value,price:$('aPrice').value.trim(),img:img||''}).then(function(){
      $('aName').value='';$('aPrice').value='';$('aImg').value='';toast('تمت الإضافة');
    }).catch(denied).then(function(){btn.disabled=false;btn.style.opacity=1});
  }
  var f=$('aImg').files[0];f?shrink(f,add):add('');
};
drawCats();drawGrid();
if(USE_FB)initFB();
</script>
